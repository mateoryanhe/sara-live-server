server:
  ###系统配置
  address: 443  #http服务端口
  serverRoot: "/home/ec2-user/cdn/official-site"  # 默认静态目录(官网)
  imageStaticPrefix: "/images"  # 图片 URL 前缀,须在 staticPaths 中配置对应 path
  staticPaths:
    - prefix: "/cms"
      path: "/home/ec2-user/cdn/cms"
    - prefix: "/images"
      path: "/home/ec2-user/cdn/images"
    - prefix: "/official-site"
      path: "/home/ec2-user/cdn/official-site"
  httpsCertPath: "/root/.acme.sh/www.bigtktool.shop_ecc/fullchain.pem"
  httpsKeyPath: "/root/.acme.sh/www.bigtktool.shop_ecc/privkey.pem"
  clientMaxBodySize: "5g"   # HTTP 请求体/上传上限(唯一大小限制,Go业务层不再校验)
  readTimeout: "120m"
  writeTimeout: "120m"
  gzipEnabled: true         # 开启 gzip 响应压缩
  logPath: "/home/ec2-user/log/"        # 服务器访问/错误日志目录
  logStdout: false                       # 访问日志同时输出到终端
  accessLogEnabled: true                # 开启访问日志(执行时间、IP、URL)
  accessLogPattern: "access-{Y-m-d}.log"
  errorLogPattern: "error-{Y-m-d}.log"
  # PProf配置
  pprofEnabled: true # 是否开启PProf性能调试特性。默认为false
  pprofPattern: "/66dcd8e25ab3b339546ea1de5eb2d443e6fca76c76d11709f10533be8bd87d7d/pprof"    # 开启PProf时有效，表示PProf特性的页面访问路径，对当前Server绑定的所有域名有效
  ####自定义配置
  exitTime: 5 #退出系统等待多少秒，开始发送kill -9
  dumpRouterMap: false
  memoryLimitM: 300
  # domainSites 多域名示例见 config/local/config.yaml

logQuery:
  exportStaticPrefix: "/cms"           # 日志导出静态 URL 前缀,对应 staticPaths 中的 /cms
  exportSubDir: "log-query-export"     # 导出目录: /home/ec2-user/cdn/cms/log-query-export

bufferSize:
  db:
    lazy:
      period: 15000 # 懒缓冲落库周期(毫秒),15秒
    fast:
      period: 500 # 快速缓冲落库周期(毫秒),配合500ms调度,约1秒内入库
  websocket:
    size: 30 # 推送批量大小(未配置时默认10)
  goPool:
    size: 400 # 协程池大小(未配置时走默认池)

logger:
  timeFormat: "2006-01-02T15:04:05.000"
  level: "all"
  flags: 45
  path: "/home/ec2-user/log/"
  file: "detail-{Y-m-d}.log"  # 与 detail 一致，避免产生 2026-07-20.log 等无前缀文件
  rotateExpire: "3d"              # 保留最近3天的按日日志，过期直接删（不产生时间戳备份）
  rotateBackupLimit: 0          # 0=不保留备份，过期直接删，不产生 detail-xxx.20260720....log
  rotateBackupExpire: 0
  rotateBackupCompress: 0
  stdoutColorDisabled: false
  writerColorEnable: true
  detail:                               # API详情日志；启动时同步为默认 g.Log()
    path: "/home/ec2-user/log/"
    file: "detail-{Y-m-d}.log"
    stdout: true
    header: true
  error:                                # xrlog 错误日志，g.Log("error")
    path: "/home/ec2-user/log/"
    file: "error-{Y-m-d}.log"
    stdout: false

database:
  logger:
    path: '/home/ec2-user/log/gf_app'
    level: "all"
    stdout: true
  default:
    link: "mysql:root:Appledev882116@tcp(127.0.0.1:3306)/live_db"
    extra: "charset=utf8mb4&parseTime=True&loc=Local"
    maxIdle: 2
    maxOpen: 8
    maxLifetime: "30s"
    debug: true
