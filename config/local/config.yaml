server:
  ###系统配置
  address: 9443  #http服务端口
  openapiPath: "/f9acdb1da4ed11ecc115d613e291af14-api.json" # OpenAPI接口文档地址
  swaggerPath: "/f9acdb1da4ed11ecc115d613e291af14-swagger"  # 内置SwaggerUI展示地址
  serverRoot: 'D:\company-code\app-code\live-server'
  clientMaxBodySize: "300m" # HTTP 请求体/文件上传上限
  gzipEnabled: true         # 开启 gzip 响应压缩
  # PProf配置
  pprofEnabled: true # 是否开启PProf性能调试特性。默认为false
  pprofPattern: "/66dcd8e25ab3b339546ea1de5eb2d443e6fca76c76d11709f10533be8bd87d7d/pprof"    # 开启PProf时有效，表示PProf特性的页面访问路径，对当前Server绑定的所有域名有效
  logPath: 'd:\log\'        # 服务器访问/错误日志目录
  logStdout: false                       # 访问日志同时输出到终端
  accessLogEnabled: true                # 开启访问日志(执行时间、IP、URL)
  accessLogPattern: "access-{Y-m-d}.log"
  ####自定义配置
  debugEnv: true #是否开启debug环境,不会检查权限
  exitTime: 30 #退出系统等待多少秒，开始发送kill -9
  dumpRouterMap: false
  # 多域名静态目录与HTTPS证书(SNI)
  # domainSites:
  #   - domain: "cdn.example.com"
  #     root: "D:/cdn/site1"
  #     certFile: "D:/certs/cdn.example.com/fullchain.pem"
  #     keyFile: "D:/certs/cdn.example.com/privkey.pem"


bufferSize:
  db:
    lazy:
      period: 15000 # 懒缓冲落库周期(毫秒),15秒
    fast:
      period: 500 # 快速缓冲落库周期(毫秒),配合500ms调度,约1秒内入库
  websocket:
    size: 30 # 推送批量大小(未配置时默认10)
  goPool:
    size: 100 # 协程池大小(未配置时走默认池)


logger:
  timeFormat: "2006-01-02T15:04:05"
  level: "all"
  flags: 4
  path: 'd:\log\'
  file: "detail-{Y-m-d}.log"
  rotateExpire: "3d"
  rotateBackupLimit: 0
  rotateBackupExpire: 0
  rotateBackupCompress: 0
  stdoutColorDisabled: false
  writerColorEnable: true
  detail:
    path: 'd:\log\'
    file: "detail-{Y-m-d}.log"
    stdout: true
    header: true
  error:
    path: 'd:\log\'
    file: "error-{Y-m-d}.log"
    stdout: false

database:
  logger:
    path: 'd:\log\'
    level: "all"
    stdout: true
  default:
    link: "mysql:root:root123456@tcp(127.0.0.1:3307)/live_db"
    extra: "charset=utf8mb4&parseTime=True&loc=Local"
    debug: true