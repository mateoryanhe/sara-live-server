server:
  ###系统配置
  address: 9443  #http服务端口
  openapiPath: "/f9acdb1da4ed11ecc115d613e291af14-api.json" # OpenAPI接口文档地址
  openapiExportAll: false # OpenAPI导出范围:false=仅App端(含推送),true=全部(App+CMS)
  swaggerPath: "/f9acdb1da4ed11ecc115d613e291af14-swagger"  # 内置SwaggerUI展示地址  # 内置SwaggerUI展示地址
  serverRoot: 'D:/company-code/app-code/live-server'
  imageStaticPrefix: "/images"  # 图片 URL 前缀,须在 staticPaths 中配置对应 path
  staticPaths:
    - prefix: "/cms"
      path: "D:/company-code/app-code/live-server/cms"
    - prefix: "/cms-export"
      path: "D:/company-code/app-code/live-server/cms-export"
      ttlMinutes: 30
    - prefix: "/images"
      path: "D:/log"
    - prefix: "/official-site"
      path: "D:/company-code/app-code/live-server/official-site"
  clientMaxBodySize: "5g"   # HTTP 请求体/上传上限(唯一大小限制,Go业务层不再校验)
  readTimeout: "120m"
  writeTimeout: "120m"
  gzipEnabled: true
  graceful: true
  hotRestartFlushTimeout: 60
  hotRestartExitTimeout: 60
  # PProf配置
  pprofEnabled: true
  pprofPattern: "/66dcd8e25ab3b339546ea1de5eb2d443e6fca76c76d11709f10533be8bd87d7d/pprof"
  ####自定义配置
  debugEnv: true #是否开启debug环境,不会检查权限
  dumpRouterMap: false
  # 多域名静态目录与HTTPS证书(SNI)
  # domainSites:
  #   - domain: "cdn.example.com"
  #     root: "D:/cdn/site1"
  #     certFile: "D:/certs/cdn.example.com/fullchain.pem"
  #     keyFile: "D:/certs/cdn.example.com/privkey.pem"

bufferSize:
  db:
    tickIntervalMs: 1000   # 调度周期(毫秒)
    cpuIdlePercent: 70     # 系统 CPU 空闲比例达到该值才批量落库
    maxPendingWaitMs: 5000 # Pending 最长等待(毫秒),超时强制落库
    batchSize: 100         # 每轮全局批量落库上限(所有 queue 共用)
  websocket:
    size: 30 # 推送批量大小(未配置时默认10)
  goPool:
    size: 100 # 协程池大小(未配置时走默认池)


logger:
  detail:
    path: "D:/log"
    file: "detail.log"
    stdout: true
    header: true
  error:
    path: "D:/log"
    file: "error.log"
    stdout: true

database:
  logger:
    path: "D:/log/sql"
    level: "all"
    stdout: true
  default:
    link: "mysql:appuser:Appledev882116@tcp(127.0.0.1:3390)/live_db"
    extra: "charset=utf8mb4&parseTime=True&loc=Local"
    debug: true

