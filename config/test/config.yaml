server:
  ###系统配置
  address: 443  #http服务端口
  openapiPath: "/f9acdb1da4ed11ecc115d613e291af14-api.json" # OpenAPI接口文档地址
  swaggerPath: "/f9acdb1da4ed11ecc115d613e291af14-swagger"  # 内置SwaggerUI展示地址
  serverRoot: "/home/ec2-user/cdn/official-site"  # 默认静态目录(官网)
  imageStaticPrefix: "/images"  # 图片 URL 前缀,须在 staticPaths 中配置对应 path
  staticPaths:
    - prefix: "/cms"
      path: "/home/ec2-user/cdn/cms"
    - prefix: "/images"
      path: "/home/ec2-user/cdn/images"
    - prefix: "/official-site"
      path: "/home/ec2-user/cdn/official-site"
  httpsCertPath: "/etc/letsencrypt/live/cai.hzaicoin.fun/fullchain.pem"
  httpsKeyPath: "/etc/letsencrypt/live/cai.hzaicoin.fun/privkey.pem"
  logPath: "/home/ec2-user/log/"
  accessLogEnabled: true
  accessLogPattern: "access-{Y-m-d}.log"
  errorLogPattern: "error-{Y-m-d}.log"
  # PProf配置
  pprofEnabled: true # 是否开启PProf性能调试特性。默认为false
  pprofPattern: "/66dcd8e25ab3b339546ea1de5eb2d443e6fca76c76d11709f10533be8bd87d7d/pprof"    # 开启PProf时有效，表示PProf特性的页面访问路径，对当前Server绑定的所有域名有效
  ####自定义配置
  debugEnv: true #是否开启debug环境,不会检查权限
  exitTime: 5 #退出系统等待多少秒，开始发送kill -9
  memoryLimitM: 200
  # 多域名静态目录与HTTPS证书(SNI), 不同域名指向不同静态目录
  # domainSites:
  #   - domain: "cdn1.example.com"
  #     root: "/home/ec2-user/cdn/site1"
  #     certFile: "/etc/letsencrypt/live/cdn1.example.com/fullchain.pem"
  #     keyFile: "/etc/letsencrypt/live/cdn1.example.com/privkey.pem"
  #   - domain: "cdn2.example.com"
  #     root: "/home/ec2-user/cdn/site2"
  #     certFile: "/etc/letsencrypt/live/cdn2.example.com/fullchain.pem"
  #     keyFile: "/etc/letsencrypt/live/cdn2.example.com/privkey.pem"


bufferSize:
  db:
    lazy:
      period: 15000 # 懒缓冲落库周期(毫秒),15秒
    fast:
      period: 500 # 快速缓冲落库周期(毫秒),配合500ms调度,约1秒内入库
  websocket:
    size: 30 # 推送批量大小(未配置时默认10)
  goPool:
    size: 100 # 协程池大小(未配置时走默认池)


logger:
  timeFormat: "2006-01-02T15:04:05"
  level: "all"
  rotateBackupExpire: 0
  rotateBackupCompress: 0
  rotateCheckInterval: "1h"
  stdoutColorDisabled: false
  writerColorEnable: true
  detail:
    path: "/home/ec2-user/log/"
    file: "detail-{Y-m-d}.log"
    stdout: true
    header: true
  error:
    path: "/home/ec2-user/log/"
    file: "error-{Y-m-d}.log"
    stdout: false

database:
  logger:
    path: "/home/ec2-user/log/gf-app/sql"
    level: "all"
    stdout: true
  default:
    link: "mysql:root:Appledev882116@tcp(127.0.0.1:3306)/live_db"
    extra: "charset=utf8mb4&parseTime=True&loc=Local"
    maxIdle: 2
    maxOpen: 5
    maxLifetime: "30s"
    debug: true